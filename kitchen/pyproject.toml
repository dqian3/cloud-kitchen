[project]
name = "kitchen"
version = "0.1.0"
description = "Experiment-orchestration library: remote execution, cluster lifecycle, sweeps, events"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kitchen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
