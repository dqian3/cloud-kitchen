[project]
name = "kitchend"
version = "0.1.0"
description = "cloud-kitchen daemon: experiment job queue, cluster manager, results catalog"
requires-python = ">=3.10"
dependencies = [
    "kitchen",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
kitchend = "kitchend.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kitchend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
